<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin – Mookiland Birthday</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=2">
<link rel="stylesheet" href="assets/admin.css?v=2">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">🎈 Mookiland <small>Admin Birthday</small></div>
    <div class="sp"></div>
    <a class="btn sun sm hidden" id="btnNew" href="index.html?admin=1" target="_blank" rel="noopener">＋ Booking baru</a>
    <button class="btn light sm hidden" id="btnLogout" type="button">Keluar</button>
  </div>
</header>

<main class="wrap">
  <section class="card login" id="loginView">
    <h2>Masuk admin</h2>
    <form id="loginForm">
      <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
      <div id="loginErr" class="err hidden"></div>
      <button class="btn" type="submit" id="loginBtn" style="margin-top:12px">Masuk</button>
    </form>
  </section>

  <section id="appView" class="hidden">
    <div class="stats" id="stats"></div>

    <div class="toolbar card">
      <div class="seg" role="tablist" id="viewSeg">
        <button type="button" data-v="upcoming" class="on">Akan datang</button>
        <button type="button" data-v="pending">Menunggu DP</button>
        <button type="button" data-v="cake">Cake belum final</button>
        <button type="button" data-v="past">Sudah lewat</button>
        <button type="button" data-v="all">Semua</button>
      </div>
      <input id="q" type="search" placeholder="Cari no. booking, nama, anak, WA…" aria-label="Cari">
      <select id="fYear" aria-label="Tahun"><option value="">Semua tahun</option></select>
      <button type="button" class="btn ghost sm" id="btnReload">↻ Muat ulang</button>
      <button type="button" class="btn ghost sm" id="btnBlock">Blokir slot</button>
      <button type="button" class="btn ghost sm" id="btnPw">Ganti password</button>
    </div>

    <div class="card tablecard">
      <div class="tablewrap">
        <table class="tbl" id="tbl">
          <thead><tr><th>Tanggal / sesi</th><th>Area</th><th>No. booking</th><th>Klien / anak</th><th class="n">Anak</th><th class="n">Total</th><th class="n">Dibayar</th><th>Status</th></tr></thead>
          <tbody id="tbody"><tr><td colspan="8" class="muted">Memuat…</td></tr></tbody>
        </table>
      </div>
      <div class="muted small" id="count" style="margin-top:8px"></div>
    </div>
  </section>
</main>

<dialog id="dlg" class="dlg">
  <div class="dlg-head"><b id="dlgTitle">Booking</b><button type="button" class="x" id="dlgClose" aria-label="Tutup">×</button></div>
  <div class="dlg-body" id="dlgBody"></div>
</dialog>

<dialog id="dlgSmall" class="dlg small-dlg">
  <div class="dlg-head"><b id="smTitle"></b><button type="button" class="x" id="smClose" aria-label="Tutup">×</button></div>
  <div class="dlg-body" id="smBody"></div>
</dialog>

<script src="config.js?v=2"></script>
<script src="assets/common.js?v=2"></script>
<script src="assets/admin.js?v=2"></script>
</body>
</html>
